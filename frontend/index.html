<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dressing</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 12px; font-size: 16px; cursor: pointer; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    ul { list-style: none; padding: 0; }
  </style>
</head>
<body>
  <h1>👕 Dressing</h1>

  <form id="form">
    <input id="name" placeholder="New item, e.g. Black jacket" required>
    <button>Add</button>
  </form>

  <ul id="list"></ul>

  <script>
    const list = document.getElementById("list");
    const input = document.getElementById("name");

    async function load() {
      const items = await fetch("/api/items").then(r => r.json());
      list.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item.name;
        const del = document.createElement("button");
        del.textContent = "✕";
        del.onclick = async () => {
          await fetch("/api/items/" + item.id, { method: "DELETE" });
          load();
        };
        li.appendChild(del);
        list.appendChild(li);
      }
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      await fetch("/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: input.value })
      });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
