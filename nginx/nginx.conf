server {
    listen 80;

    # Frontend (static files)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # API -> Node container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
